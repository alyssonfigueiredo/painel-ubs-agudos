<head>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0f2b26;
    --card: #17352e;
    --card-2: #1d4038;
    --line: rgba(255,255,255,0.08);
    --text: #f3f2ec;
    --text-dim: #93a8a2;
    --coral: #e8917a;
    --yellow: #f2cf5b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', Arial, sans-serif;
  }
  h1,h2 { font-family: 'Manrope', Arial, sans-serif; }
  .view { display: none; }
  .view.active { display: block; }

  /* ---------- picker ---------- */
  #view-picker.active {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .picker-card {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 48px;
    width: 100%;
    max-width: 760px;
    margin: 24px;
  }
  #salaButtons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 560px) { #salaButtons { grid-template-columns: 1fr; } }
  .sub { color: var(--coral); font-weight: 700; letter-spacing: 0.1em; font-size: 13px; margin-bottom: 6px; }
  .picker-card h1 { font-size: 26px; font-weight: 800; margin: 0 0 28px; }
  .sala-btn {
    display: block;
    width: 100%;
    background: var(--card);
    color: var(--text);
    border: 1px solid var(--line);
    text-align: left;
    padding: 16px 18px;
    font-weight: 600;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .sala-btn:active { background: var(--card-2); }
  .recepcao-btn {
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 22px;
  }
  .recepcao-btn button {
    background: var(--coral);
    color: #21140f;
    border: none;
    width: 100%;
    padding: 16px 18px;
    font-weight: 700;
    font-size: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }

  /* ---------- caller (sala) ---------- */
  #view-caller.active {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: linear-gradient(180deg, var(--card-2), var(--card));
    border: 1px solid var(--line);
    border-radius: 28px;
    padding: 48px;
    width: 100%;
    max-width: 460px;
    margin: 24px;
    position: relative;
    overflow: hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0 auto 0 0;
    width:6px;
    background: var(--yellow);
    opacity:.7;
  }
  input[type=text] {
    width: 100%;
    font-size: 18px;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
  }
  input[type=text]::placeholder { color: var(--text-dim); }
  input[type=text]:focus { outline: none; border-color: var(--coral); }
  button.primary {
    width: 100%;
    font-size: 18px;
    font-weight: 700;
    padding: 14px;
    background: var(--coral);
    color: #21140f;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary:active { opacity: 0.85; }
  .feedback {
    text-align: center;
    margin-top: 14px;
    font-size: 14px;
    color: var(--yellow);
    height: 18px;
  }
  .trocar-btn {
    display: block;
    width: 100%;
    margin-top: 18px;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--line);
    padding: 12px 16px;
    font-weight: 600;
    font-size: 14px;
    border-radius: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .trocar-btn:active { background: var(--card); }
  .hist-sala { margin-top: 20px; }
  .hist-sala .hist-titulo { color: var(--text-dim); font-size: 12px; font-weight: 700; letter-spacing: 0.08em; margin-bottom: 8px; }
  .hist-sala-item {

  /* ---------- recepcao ---------- */
  .page { max-width: 1400px; margin: 0 auto; padding: 40px 48px; }
  header {

    justify-content: space-between;

    color: var(--text);

    padding: 12px 20px;
    font-weight: 800;
    font-size: 14px;

  .mudo-btn.mudo-ativo {

    50% { box-shadow: 0 4px 28px rgba(255,107,107,0.65); }

<!-- gerado pelo `npm run deploy` (scripts/deploy.mjs); não existe no git -->
<script src="versao.js"></script>
<script>
// ===================== CONFIGURAÇÃO =====================
const firebaseConfig = {
  apiKey: "AIzaSyCWqkLR3gH48VOrBQuDfg_UOJx0nlATeRs",
  authDomain: "painel-ubs-c7992.firebaseapp.com",
  databaseURL: "https://painel-ubs-c7992-default-rtdb.firebaseio.com",
  projectId: "painel-ubs-c7992",
  storageBucket: "painel-ubs-c7992.firebasestorage.app",
  messagingSenderId: "872483474831",
  appId: "1:872483474831:web:c4cdf18ff71064f772cffa"
};

const SALAS = [
  "Consultório 01",
  "Consultório 02",
  "Consultório 03",
  "Consultório 04",
  "Odontologia",
  "Nutrição",
  "Enfermagem",
  "Triagem",
  "Sala de Vacina",
  "Sala de Medicação"
];
const MAX_HISTORICO = 6;
const REPETICOES_CHAMADO = 2; // quantas vezes a recepção anuncia cada chamado automático

// Versão = horário do deploy, gerado automaticamente em versao.js pelo `npm run deploy`.
// A primeira tela que carrega a versão nova grava o número em painel/versao, e toda
// tela aberta com número menor recarrega sozinha (consultório na hora; recepção quando
// não estiver falando). Sem isso, uma aba esquecida em outro PC roda código velho pra
// sempre. Deploy feito sem o script (versao.js ausente) → 0: não grava nem recarrega.
const VERSAO = (typeof window.VERSAO_DEPLOY === 'number') ? window.VERSAO_DEPLOY : 0;

// Caminhos no banco. RENOMEADOS de propósito em relação às versões antigas (calls/ e
// estado/): uma recepção antiga esquecida aberta em outro PC — de qualquer versão, até
// do domínio antigo, já que o banco é o mesmo — escuta os caminhos velhos e por isso
// nunca mais recebe chamado nenhum. Era uma dessas que roubava a fala da TV.
const DB = {
  chamadas: 'chamadas',
  falando: 'painel/falando',
  recepcaoAtiva: 'painel/recepcao_ativa',
  salasAtivas: 'painel/salas_ativas',  // uma entrada por sala, mesma trava da recepção
  versao: 'painel/versao'
};

// Voz da recepção: PRINCIPAL é a Google Cloud TTS (masculina "Orus", Chirp 3 HD), gerada
// pelo Worker em /tts (chave fica no Cloudflare). RESERVA, se o /tts falhar (cota do mês
// estourada, chave/API com problema, sem internet): voz do próprio navegador — procura,
// nesta ordem, entre as vozes em português instaladas; se nenhuma existir, a padrão pt-BR.
const VOZ_LANG = 'pt-BR';
const VOZES_PREFERIDAS = ['Microsoft Daniel', 'Daniel', 'Reed', 'Eddy', 'Rocko', 'Grandpa', 'Felipe'];
// ==========================================================

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const views = {
  picker: document.getElementById('view-picker'),
  caller: document.getElementById('view-caller'),
  recepcao: document.getElementById('view-recepcao')
};

function mostrarView(nome) {
  Object.values(views).forEach(v => v.classList.remove('active'));
  views[nome].classList.add('active');
}

// ---------------- roteamento por papel salvo neste PC ----------------
function init() {
  const papel = localStorage.getItem('papel_tela'); // 'recepcao' ou nome de uma sala
  if (papel === 'recepcao') {
    mostrarView('recepcao');
    iniciarRecepcao();
  } else if (papel && SALAS.includes(papel)) {
    mostrarView('caller');
    iniciarCaller(papel);
  } else {
    mostrarView('picker');
    montarPicker();
  }
}

// ---------------- trava de papel: UMA tela por papel ----------------
// Vale pra TV da recepção e pra cada sala. Regra: QUEM JÁ ESTÁ ATIVA FICA. Uma segunda
// tela do mesmo papel encontra a primeira viva e fica BLOQUEADA com aviso; assumir é
// só por clique no aviso — nunca sozinha, nem se a ativa sumir. A ativa manda batimento
// a cada 15s e é apagada do banco ao desconectar. Única decisão automática: na CARGA
// da página, se o registro que existe está morto há mais de 45s (queda de energia e
// ninguém mais aberto), a tela assume. O id da tela fica em sessionStorage: um F5 na
// mesma aba mantém o id, então a tela reconhece a si mesma e segue ativa.
const BATIMENTO_MS = 15000;
const MORTA_APOS_MS = 45000; // 3 batimentos perdidos
let offsetServidor = 0; // relógio do PC pode estar errado; compara ts com a hora do servidor
db.ref('.info/serverTimeOffset').on('value', snap => { offsetServidor = snap.val() || 0; });
function agoraServidor() { return Date.now() + offsetServidor; }

function idDestaAba() {
  let id = null;
  try { id = sessionStorage.getItem('id_aba'); } catch (e) {}
  if (!id) {
    id = Math.random().toString(36).slice(2) + '-' + Date.now();
    try { sessionStorage.setItem('id_aba', id); } catch (e) {}
  }
  return id;
}

// aoMudar(ativa, registroDaOutra) é chamado ao assumir e ao ser bloqueada
function travaDePapel(ref, aoMudar) {
  const meuId = idDestaAba();
  let ativa = false;
  let decidiu = false; // "assumo ou bloqueio" é decidido UMA vez, na carga
  let batimento = null;
  function assumir() {
    ativa = true;
    ref.set({ id: meuId, ts: firebase.database.ServerValue.TIMESTAMP });
    ref.onDisconnect().remove();
    if (!batimento) {
      batimento = setInterval(() => {
        if (ativa) ref.update({ ts: firebase.database.ServerValue.TIMESTAMP });
      }, BATIMENTO_MS);
    }
    aoMudar(true, null);
  }
  function bloquear(val) {
    ativa = false;
    aoMudar(false, val);
  }
  function outraViva(val) {
    return !!(val && val.id && val.id !== meuId && (agoraServidor() - (val.ts || 0)) < MORTA_APOS_MS);
  }
  const escuta = snap => {
    const val = snap.val();
    if (!decidiu) {
      decidiu = true;
      if (outraViva(val)) bloquear(val); else assumir();
      return;
    }
    // alguém clicou "assumir" em outra tela — cede. Bloqueada NUNCA volta sozinha.
    if (ativa && val && val.id && val.id !== meuId) bloquear(val);
  };
  ref.on('value', escuta);
  return {
    assumir,
    parar() {
      ref.off('value', escuta);
      clearInterval(batimento);
      if (ativa) { ref.onDisconnect().cancel(); ref.remove(); }
      ativa = false;
    }
  };
}

const bloqueadoEl = document.getElementById('bloqueado');
const bloqueadoTitulo = document.getElementById('bloqueadoTitulo');
const bloqueadoTexto = document.getElementById('bloqueadoTexto');
function mostrarBloqueio(titulo, texto) {
  bloqueadoTitulo.textContent = titulo;
  bloqueadoTexto.textContent = texto;
  bloqueadoEl.classList.add('ativa');
}
function esconderBloqueio() { bloqueadoEl.classList.remove('ativa'); }
function horaDe(ts) {
  return ts ? new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '?';
}

// ver comentário em VERSAO. podeRecarregar() diz se é seguro recarregar agora.
function vigiarVersao(podeRecarregar) {
  if (!VERSAO) return; // deploy sem o script: não participa da auto-atualização
  const ref = db.ref(DB.versao);
  ref.transaction(v => (typeof v === 'number' && v >= VERSAO) ? undefined : VERSAO);
  let timer = null;
  ref.on('value', snap => {
    const v = snap.val();
    if (!(typeof v === 'number' && v > VERSAO)) return;
    if (timer) return;
    const tentar = () => {
      if (podeRecarregar()) { location.reload(); return; }
      timer = setTimeout(tentar, 3000);
    };
    tentar();
  });
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function montarPicker() {
  const salaButtonsEl = document.getElementById('salaButtons');
  salaButtonsEl.innerHTML = '';
  SALAS.forEach(sala => {
    const btn = document.createElement('button');
    btn.textContent = sala;
    btn.className = 'sala-btn';
    btn.onclick = () => {
      localStorage.setItem('papel_tela', sala);
      mostrarView('caller');
      iniciarCaller(sala);
    };
    salaButtonsEl.appendChild(btn);
  });
  document.getElementById('btnRecepcao').onclick = () => {
    localStorage.setItem('papel_tela', 'recepcao');
    mostrarView('recepcao');
    iniciarRecepcao();
  };
}

// ---------------- painel do consultório ----------------
function iniciarCaller(sala) {
  document.getElementById('salaAtual').textContent = sala;
  const inputEl = document.getElementById('nomePaciente');
  const feedbackEl = document.getElementById('feedback');
  const btnChamarEl = document.getElementById('btnChamar');
  inputEl.focus();

  // mesma sala aberta em 2 PCs = risco de chamado duplicado. Mesma trava da recepção.
  let salaBloqueada = false;
  const travaSala = travaDePapel(db.ref(DB.salasAtivas + '/' + sala), (ativa, outra) => {
    salaBloqueada = !ativa;
    inputEl.disabled = salaBloqueada;
    atualizarBotaoChamar();
    if (salaBloqueada) {
      mostrarBloqueio(sala + ' já está aberta em outro computador',
        'Último sinal da outra tela às ' + horaDe(outra && outra.ts) + '. Pra evitar chamados duplicados, esta tela fica bloqueada. Se ESTE é o computador certo, clique aqui pra assumir.');
    } else {
      esconderBloqueio();
      inputEl.focus();
    }
  });
  bloqueadoEl.onclick = travaSala.assumir;

  document.getElementById('trocarSalaCaller').onclick = () => {
    if (!confirm('Trocar a sala desta tela?')) return;
    historicoSalaRef.off();
    travaSala.parar();
    esconderBloqueio();
    localStorage.removeItem('papel_tela');
    mostrarView('picker');
    montarPicker();
  };

  // últimos chamados feitos por ESTA sala — usa o índice de "ts" que já existe, e
  // filtra por sala no cliente (evita precisar de outro índice novo no banco)
  const historicoSalaEl = document.getElementById('historicoSala');
  const MAX_HISTORICO_SALA = 4;
  let historicoSala = [];
  function renderHistoricoSala() {
    if (historicoSala.length === 0) { historicoSalaEl.innerHTML = ''; return; }
    historicoSalaEl.innerHTML =
      '<div class="hist-titulo">ÚLTIMOS CHAMADOS DESTA SALA</div>' +
      historicoSala.map(h => {
        const hora = h.ts ? new Date(h.ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) : '';
        return `<div class="hist-sala-item"><span class="h-nome">${escapeHtml(h.nome)}</span><span class="h-hora">${escapeHtml(hora)}</span></div>`;
      }).join('');
  }
  const historicoSalaRef = db.ref(DB.chamadas).orderByChild('ts').limitToLast(50);
  historicoSalaRef.on('child_added', snap => {
    const val = snap.val();
    if (!val || val.sala !== sala) return;
    historicoSala.unshift(val);
    historicoSala = historicoSala.slice(0, MAX_HISTORICO_SALA);
    renderHistoricoSala();
  });

  // bloqueia o botão Chamar enquanto a recepção estiver anunciando outro chamado —
  // impede que 2 chamados se sobreponham na fala
  let ocupado = false;
  function atualizarBotaoChamar() {
    btnChamarEl.disabled = ocupado || salaBloqueada;
    btnChamarEl.textContent = ocupado ? 'Aguarde...' : 'Chamar';
  }
  db.ref(DB.falando).on('value', snap => {
    ocupado = !!snap.val();
    atualizarBotaoChamar();
    if (ocupado) {
      feedbackEl.style.color = '';
      feedbackEl.textContent = 'Aguarde, chamada em andamento na recepção...';
    } else if (feedbackEl.textContent === 'Aguarde, chamada em andamento na recepção...') {
      feedbackEl.textContent = '';
    }
  });

  function chamar() {
    if (ocupado || salaBloqueada) return;
    const nome = inputEl.value.trim();
    if (!nome) { inputEl.focus(); return; }
    db.ref(DB.chamadas).push({
      sala: sala,
      nome: nome.toUpperCase(),
      ts: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      feedbackEl.style.color = '';
      feedbackEl.textContent = 'Chamado enviado.';
      setTimeout(() => { if (!ocupado) feedbackEl.textContent = ''; }, 2000);
    }).catch(err => {
      feedbackEl.style.color = '#ff8a80';
      feedbackEl.textContent = 'Erro ao enviar: ' + err.message;
    });
    inputEl.value = '';
    inputEl.focus();
  }

  btnChamarEl.onclick = chamar;
  inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') chamar(); });
  vigiarVersao(() => true);
}

// ---------------- painel da recepção ----------------
function iniciarRecepcao() {
  const overlay = document.getElementById('overlay');
  const chamandoNomeEl = document.getElementById('chamandoNome');
  const chamandoSalaEl = document.getElementById('chamandoSala');
  const historicoEl = document.getElementById('historico');
  const statusEl = document.getElementById('status');
  const diagnosticoEl = document.getElementById('diagnostico');
  const horaEl = document.getElementById('hora');
  const dataEl = document.getElementById('data');
  const btnRepetir = document.getElementById('btnRepetir');
  const btnMudo = document.getElementById('btnMudo');

  let filaChamados = [];
  let processando = false;
  let historico = [];
  let audioAtual = null; // Audio() da fala em andamento, pra dar pause() se mutar no meio
  let finalizarFalaAtual = null; // libera a trava estado/falando — pause() sozinho NÃO dispara onended/onerror
  let ultimoChamado = null;
  let mudo = localStorage.getItem('painel_mudo') === '1';

  // SÓ UMA recepção fala (ver travaDePapel). Bloqueada = modo espelho: mostra os
  // chamados, não fala. Quem fala é a outra, até alguém clicar no aviso desta.
  let substituida = false;
  const trava = travaDePapel(db.ref(DB.recepcaoAtiva), (ativa, outra) => {
    substituida = !ativa;
    if (substituida) {
      mostrarBloqueio('Outra tela está ativa como recepção',
        'Último sinal dela às ' + horaDe(outra && outra.ts) + '. Esta só espelha os chamados; quem fala é a outra. Se ESTA é a TV da recepção, clique aqui pra assumir.');
      if (audioAtual) audioAtual.pause();
      if (window.speechSynthesis) speechSynthesis.cancel();
      if (finalizarFalaAtual) finalizarFalaAtual();
    } else {
      esconderBloqueio();
    }
  });
  bloqueadoEl.onclick = trava.assumir;

  function atualizarBotaoMudo() {
    btnMudo.textContent = mudo ? '🔇 Som desligado — clique pra reativar' : '🔊 Silenciar voz';
    btnMudo.classList.toggle('mudo-ativo', mudo);
  }
  atualizarBotaoMudo();

  // botão de emergência: corta a voz na hora (mesmo com uma fala em andamento) e
  // impede qualquer sala de ficar travada esperando áudio que não vai tocar
  btnMudo.onclick = () => {
    mudo = !mudo;
    localStorage.setItem('painel_mudo', mudo ? '1' : '0');
    if (mudo) {
      if (audioAtual) audioAtual.pause();
      if (window.speechSynthesis) speechSynthesis.cancel();
      // pause()/cancel() não liberam a trava sozinhos na hora — sem chamar isso aqui, a
      // trava painel/falando ficaria presa até o timeout de 15s toda vez que mutar no meio
      if (finalizarFalaAtual) finalizarFalaAtual();
    }
    atualizarBotaoMudo();
  };

  function atualizarRelogio() {
    const agora = new Date();
    horaEl.textContent = agora.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
    dataEl.textContent = agora.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  }
  atualizarRelogio();
  setInterval(atualizarRelogio, 30000);

  statusEl.textContent = 'voz: padrão do navegador (' + VOZ_LANG + '), reserva /tts';
  let utteranceAtual = null; // o Chrome perde onend/onerror se o objeto for coletado no meio

  function vozPreferida() {
    const pt = speechSynthesis.getVoices().filter(v => /^pt([-_]|$)/i.test(v.lang));
    for (const nome of VOZES_PREFERIDAS) {
      const v = pt.find(v => v.name.toLowerCase().startsWith(nome.toLowerCase()));
      if (v) return v;
    }
    return null;
  }
  function novaFala(texto) {
    const u = new SpeechSynthesisUtterance(texto);
    u.lang = VOZ_LANG;
    const v = vozPreferida();
    if (v) u.voice = v;
    return u;
  }

  // a 1ª fala do dia demora pra começar (carrega o motor da voz). Fala uma sílaba em
  // volume zero pra deixar pronto — assim o chamado real não estoura a guarda de tempo.
  function aquecerVoz() {
    if (!window.speechSynthesis) return;
    const u = novaFala('a');
    u.volume = 0;
    utteranceAtual = u;
    speechSynthesis.speak(u);
  }

  // fala com a voz do navegador; aoFalhar(motivo) se não der (negado por falta de clique,
  // sem voz em português, ou travou sem começar em 2s) — aí o chamador usa o /tts
  function falarComNavegador(texto, aoTerminar, aoFalhar) {
    if (!window.speechSynthesis) { aoFalhar('navegador sem speechSynthesis'); return; }
    const u = novaFala(texto);
    u.rate = 0.95;
    let comecou = false;
    let falhou = false;
    const guarda = setTimeout(() => {
      if (comecou || falhou) return;
      falhou = true;
      speechSynthesis.cancel();
      aoFalhar('voz do navegador não começou em 5s');
    }, 5000);
    // o Chrome às vezes NÃO dispara onend (bug antigo) — aí a trava dos consultórios
    // ficaria presa até o timeout de 15s. Vigia speechSynthesis.speaking como garantia.
    let terminado = false;
    let vigia = null;
    function terminar() {
      if (terminado) return;
      terminado = true;
      clearInterval(vigia);
      aoTerminar();
    }
    u.onstart = () => {
      comecou = true;
      clearTimeout(guarda);
      diag('falando com a voz do navegador' + (u.voice ? ' (' + u.voice.name + ')' : ' (padrão do sistema)'));
      vigia = setInterval(() => {
        if (!speechSynthesis.speaking && !speechSynthesis.pending) { diag('fim detectado pelo vigia'); terminar(); }
      }, 300);
    };
    u.onend = () => { if (comecou && !falhou) terminar(); };
    u.onerror = e => {
      clearTimeout(guarda);
      if (falhou) return;
      if (e.error === 'interrupted' || e.error === 'canceled') { if (comecou) terminar(); return; }
      falhou = true;
      aoFalhar('voz do navegador: ' + e.error);
    };
    utteranceAtual = u;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }

  setInterval(() => { tentarLiberarAudio(); }, 10000);

  // 2ª camada de "manter vivo": um AudioContext tocando um tom INAUDÍVEL (ganho zero)
  // continuamente — é o sinal que mais navegadores usam pra considerar a aba "produzindo
  // áudio de verdade" (mais forte que só a tag <audio>, que pode ter o autoplay bloqueado
  // silenciosamente do mesmo jeito). Os dois juntos cobrem navegadores diferentes.
  let audioCtx = null;
  function iniciarAudioContextSilencioso() {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      gain.gain.value = 0; // inaudível de propósito
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
    } catch (e) {
      diag('audioctx falhou: ' + e.message);
    }
  }

  let somLiberado = false;
  let comoLiberou = 'ainda não';
  function tentarLiberarAudio() {
    const audioEl = document.getElementById('keepAliveAudio');
    if (audioEl) {
      audioEl.play().then(() => {
        // o navegador deixou tocar sem clique (Chrome libera pra sites que tocam som com
        // frequência) — o /tts, que é <audio>, vai tocar também. Esconde o overlay.
        if (!somLiberado) { comoLiberou = 'sozinho (sem clique)'; liberarSom(); }
      }).catch(err => {
        diag('áudio de fundo bloqueado: ' + (err && err.name ? err.name : err));
      });
    }
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }

  // chamado no clique do overlay OU sozinho, se o navegador já libera áudio e voz sem gesto
  function liberarSom() {
    somLiberado = true;
    aquecerVoz();
    // toca um áudio SILENCIOSO em loop desde já e deixa rodando o dia inteiro —
    // estabelece a aba como "produzindo áudio" pro Chrome, o que a política de autoplay
    // de <audio> aceita mesmo sem gesto recente (diferente do speechSynthesis, que expira
    // a liberação poucos segundos após o último clique — foi o que causava "só funciona
    // clicando Repetir na tela")
    if (!audioCtx) iniciarAudioContextSilencioso();
    tentarLiberarAudio();
    overlay.style.display = 'none';
  }
  overlay.onclick = () => { comoLiberou = 'clique'; liberarSom(); };
  tentarLiberarAudio();

  // texto pra FALA (a tela continua em maiúsculas): nome todo em maiúsculas o TTS lê
  // como sigla, soletrando; "01" vira "zero um". Ajusta só o que vai pra voz.
  function paraFala(texto) {
    return String(texto)
      .toLowerCase()
      .replace(/(^|[\s\-])(\S)/g, (m, sep, c) => sep + c.toUpperCase())
      .replace(/\b0+(\d)/g, '$1');
  }
  function textoChamado(chamado) {
    return `Atenção, ${paraFala(chamado.nome)}. Comparecer ao ${paraFala(chamado.sala)}.`;
  }

  const estadoRef = db.ref(DB.falando);
  // limpa o estado ao carregar — se a TV foi recarregada no meio de uma fala, ninguém
  // mais vai limpar aquele "true" preso e os consultórios ficariam travados pra sempre
  estadoRef.set(false);
  // e se a TV crashar/perder energia/fechar a aba NO MEIO de uma fala (sem dar tempo de
  // rodar o set(false) acima na próxima carga), o Firebase libera sozinho quando detectar
  // a desconexão — sem isso, todos os consultórios ficariam travados até alguém notar
  estadoRef.onDisconnect().set(false);

  // cada etapa da fala vira um trecho na linha de diagnóstico (em vez de sobrescrever),
  // pra dar pra ver na TV onde exatamente uma chamada parou
  const LOG_MAX = 300;
  let log = [];
  try { log = JSON.parse(localStorage.getItem('painel_log') || '[]'); } catch (e) { log = []; }
  function gravarLog(linha) {
    log.push(linha);
    if (log.length > LOG_MAX) log = log.slice(-LOG_MAX);
    try { localStorage.setItem('painel_log', JSON.stringify(log)); } catch (e) {}
    console.log('[painel] ' + linha);
  }
  // no console da TV: painelLog() lista tudo; painelLog(true) limpa
  window.painelLog = limpar => {
    if (limpar) { log = []; try { localStorage.removeItem('painel_log'); } catch (e) {} return 'limpo'; }
    return log.join('\n');
  };
  function diag(msg) {
    diagnosticoEl.textContent += ' | ' + msg;
    gravarLog(new Date().toLocaleTimeString('pt-BR') + ' ' + msg);
  }
  // tecla V: teste das vozes em português instaladas — cada aperto fala a próxima voz
  // dizendo o próprio nome (e mostra o nome na linha de diagnóstico, com D)
  let idxTesteVoz = -1;
  document.addEventListener('keydown', e => {
    if (e.key === 'd' || e.key === 'D') document.body.classList.toggle('mostrar-diag');
    if (e.key === 'v' || e.key === 'V') {
      const pt = speechSynthesis.getVoices().filter(v => /^pt([-_]|$)/i.test(v.lang));
      if (pt.length === 0) return;
      idxTesteVoz = (idxTesteVoz + 1) % pt.length;
      const v = pt[idxTesteVoz];
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance('Atenção, teste. Comparecer ao consultório. Esta é a voz ' + v.name.split(' ')[0]);
      u.voice = v; u.lang = v.lang;
      utteranceAtual = u;
      speechSynthesis.speak(u);
      diagnosticoEl.textContent = 'teste de voz ' + (idxTesteVoz + 1) + '/' + pt.length + ': ' + v.name;
      document.body.classList.add('mostrar-diag');
    }
  });

  function falar(texto, onend) {
    if (mudo) { onend(); return; } // silenciado: não fala e não trava nenhuma sala
    if (substituida) { onend(); return; } // outra recepção assumiu: só espelha a tela
    const audioElDiag = document.getElementById('keepAliveAudio');
    diagnosticoEl.textContent = `[${new Date().toLocaleTimeString('pt-BR')}]`;
    diag(`falando "${texto.slice(0,30)}..." — foco=${document.hasFocus()} vis=${document.visibilityState} audioPausado=${audioElDiag ? audioElDiag.paused : 'sem-elemento'} audioCtx=${audioCtx ? audioCtx.state : 'nulo'}`);
    let concluido = false;
    function finalizar() {
      if (concluido) return;
      concluido = true;
      clearTimeout(timeoutId);
      estadoRef.set(false);
      if (finalizarFalaAtual === finalizar) finalizarFalaAtual = null;
      onend();
    }
    finalizarFalaAtual = finalizar;
    // blinda contra falha de rede/carregamento travado — sem isso a trava de "falando"
    // (e o botão Chamar dos consultórios) ficaria presa esperando um áudio que não chega
    const timeoutId = setTimeout(() => {
      diag('TIMEOUT 15s — o áudio não terminou (rede lenta ou /tts sem resposta)');
      finalizar();
    }, 15000);

    // Esta tela é a recepção ativa (eleita em recepcao/ativa) — fala SEM disputar a
    // trava. A trava aqui só serve pra segurar o botão Chamar dos consultórios. Antes
    // era uma transação "só fala quem pega a trava primeiro": bastava uma recepção
    // esquecida aberta em outro lugar (mesmo banco, até de versão antiga do site) pra
    // ganhar a disputa e deixar a TV muda sem motivo aparente.
    estadoRef.set(true).catch(err => diag('erro na trava estado/falando: ' + err.message));

    // PRINCIPAL: MP3 da Google Cloud TTS (voz Orus), servido pela NOSSA origem em /tts
    // (src/worker.js). Baixa com fetch primeiro pra saber O MOTIVO se falhar (cota,
    // chave, API) e só então toca via <audio>; qualquer falha cai na voz do navegador.
    function tocarTts(aoFalhar) {
      const url = '/tts?q=' + encodeURIComponent(texto.slice(0, 200));
      const t0 = Date.now();
      fetch(url).then(res => {
        if (!res.ok) return res.text().then(msg => { throw new Error(res.status + ' ' + msg.slice(0, 200)); });
        return res.blob();
      }).then(blob => {
        if (concluido) return;
        const audio = new Audio(URL.createObjectURL(blob));
        audioAtual = audio;
        audio.onended = () => {
          diag('terminou em ' + (Date.now() - t0) + 'ms (duração=' + audio.duration.toFixed(1) + 's)');
          URL.revokeObjectURL(audio.src);
          finalizar();
        };
        audio.onerror = () => aoFalhar('áudio do /tts não tocou');
        audio.play()
          .then(() => diag('tocando /tts (Orus) após ' + (Date.now() - t0) + 'ms (som liberado: ' + comoLiberou + ')'))
          .catch(err => aoFalhar('play() do áudio falhou: ' + (err && err.name ? err.name : err)));
      }).catch(err => aoFalhar('/tts falhou: ' + err.message));
    }

    // principal: /tts (Google Orus); reserva: voz do navegador; se ambas falharem, libera a trava
    tocarTts(motivo => {
      if (concluido) return;
      diag(motivo + ' — usando a voz do navegador');
      falarComNavegador(texto, finalizar, motivo2 => {
        diag(motivo2 + ' — sem voz nenhuma neste chamado');
        finalizar();
      });
    });
  }

  function processarFila() {
    if (processando || filaChamados.length === 0) return;
    processando = true;
    const chamado = filaChamados.shift();

    chamandoNomeEl.textContent = chamado.nome;
    chamandoNomeEl.classList.remove('empty');
    chamandoSalaEl.textContent = chamado.sala;
    ultimoChamado = chamado;
    btnRepetir.disabled = false;

    historico.unshift(chamado);
    historico = historico.slice(0, MAX_HISTORICO);
    renderHistorico();

    anunciar(chamado, REPETICOES_CHAMADO, () => {
      processando = false;
      processarFila();
    });
  }

  // fala o chamado N vezes, com uma pausa curta entre elas
  function anunciar(chamado, vezes, aoTerminar) {
    falar(textoChamado(chamado), () => {
      if (vezes > 1 && !mudo) setTimeout(() => anunciar(chamado, vezes - 1, aoTerminar), 900);
      else aoTerminar();
    });
  }

  function renderHistorico() {
    if (historico.length === 0) {
      historicoEl.innerHTML = '<div class="empty-hist">Sem chamados anteriores.</div>';
      return;
    }
    // nome/sala vêm do banco (o médico digita, mas o banco não exige autenticação pra
    // escrever) — nunca inserir sem escapar, senão vira injeção de HTML/script na TV
    historicoEl.innerHTML = historico.map(h =>
      `<div class="history-item"><div class="nome">${escapeHtml(h.nome)}</div><div class="sala">${escapeHtml(h.sala)}</div></div>`
    ).join('');
  }

  function receberChamado(snap) {
    const val = snap.val();
    if (!val || !val.nome || !val.sala) return;
    filaChamados.push(val);
    processarFila();
  }
  // NÃO ler o caminho antigo (calls/): uma recepção velha esquecida escuta ele, e as
  // duas falariam juntas o chamado de um consultório que ainda não recarregou. Esse
  // consultório precisa de UM F5 — as próximas atualizações são automáticas.
  const callsRef = db.ref(DB.chamadas).orderByChild('ts').startAt(Date.now());
  callsRef.on('child_added', receberChamado);

  vigiarVersao(() => !processando && filaChamados.length === 0);

  btnRepetir.onclick = () => {
    if (!ultimoChamado || processando) return;
    processando = true;
    anunciar(ultimoChamado, 1, () => { processando = false; processarFila(); });
  };

  document.getElementById('trocarSalaRecepcao').onclick = () => {
    if (!confirm('Trocar o papel desta tela?')) return;
    callsRef.off();
    trava.parar();
    esconderBloqueio();
    if (audioAtual) audioAtual.pause();
    if (window.speechSynthesis) speechSynthesis.cancel();
    localStorage.removeItem('papel_tela');
    mostrarView('picker');
    montarPicker();
  };
}

init();
</script>
</body>
</html>
